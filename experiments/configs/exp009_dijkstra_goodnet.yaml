experiment:
  id: exp009
  name: dijkstra-goodnet

environment:
  controller: ryu-4.34-py38
  mininet: mininet-2.3.0
  openflow: "1.3"

controller:
  app: controller.routing_controller
  ip: 127.0.0.1
  port: 6633

routing:
  name: dijkstra
  module: controller.routing.dijkstra
  class: DijkstraRouting
  metric: routing_cost

topology:
  definition: topologies/definitions/goodnet.yaml
  placement: topologies/placements/goodnet_4_hosts.yaml

network:
  profile: network/profiles/goodnet_equal.yaml

traffic:
  profile: traffic/profiles/ping_goodnet.yaml
  generator:
    module: traffic.generators.ping
    function: run_ping

collectors:
  - name: flows
    module: collectors.flows
    function: collect_flows
