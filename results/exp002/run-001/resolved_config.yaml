experiment:
  id: exp001
  name: dijkstra-diamond-low-delay
environment:
  controller: ryu-4.34-py38
  mininet: mininet-2.3.0
  openflow: '1.3'
controller:
  app: controller.routing_controller
  ip: 127.0.0.1
  port: 6633
routing:
  name: dijkstra
  module: controller.routing.dijkstra
  class: DijkstraRouting
  metric: routing_cost
topology:
  definition: topologies/definitions/diamond.yaml
  name: diamond
  hosts:
  - name: h1
  - name: h2
  switches:
  - name: s1
    dpid: '0000000000000001'
  - name: s2
    dpid: '0000000000000002'
  - name: s3
    dpid: '0000000000000003'
  - name: s4
    dpid: '0000000000000004'
  links:
  - id: h1-s1
    source: h1
    destination: s1
  - id: s1-s2
    source: s1
    destination: s2
  - id: s2-s4
    source: s2
    destination: s4
  - id: s1-s3
    source: s1
    destination: s3
  - id: s3-s4
    source: s3
    destination: s4
  - id: s4-h2
    source: s4
    destination: h2
network:
  profile: network/profiles/diamond_alternative.yaml
  name: diamond-alternative
  links:
    s1-s2:
      delay_ms: 5
      routing_cost: 50
    s2-s4:
      delay_ms: 5
      routing_cost: 50
    s1-s3:
      delay_ms: 20
      routing_cost: 10
    s3-s4:
      delay_ms: 20
      routing_cost: 10
traffic:
  profile: traffic/profiles/ping_test.yaml
  generator:
    module: traffic.generators.ping
    function: run_ping
  config:
    type: ping
    source: h1
    destination: h2
    count: 20
    interval: 0.2
collectors:
- name: flows
  module: collectors.flows
  function: collect_flows
